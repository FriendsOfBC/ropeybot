name: Checks

on:
    push:
        branches: [main]
    pull_request: {}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: pnpm/action-setup@v2
              with:
                  version: 12

            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              run: "pnpm install"

            - name: Run Prettier
              run: "pnpm run prettier"

            - name: Compile library
              working-directory: packages/bc-bot
              run: "pnpm run build"

            - name: Check Types
              run: "pnpm run -r types"
